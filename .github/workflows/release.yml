name: Build Windows EXE and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Verify GUI toolkit
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: python build.py

      - name: Smoke test result
        shell: pwsh
        run: |
          # build.py already runs SubtitleGenerator.exe --selftest and fails
          # the job if it breaks; this step just surfaces the detailed report.
          $json = "dist\SubtitleGenerator\_selftest_result.json"
          if (-not (Test-Path $json)) { throw "selftest result was not written" }
          $r = Get-Content $json -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 5
          if (-not $r.ok) { throw "packaged exe failed self-check" }

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\SubtitleGenerator\*" -DestinationPath "SubtitleGenerator-win64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleGenerator-win64
          path: SubtitleGenerator-win64.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SubtitleGenerator-win64.zip
          generate_release_notes: true
          body: |
            ## 本地视频字幕生成器

            下载 `SubtitleGenerator-win64.zip`，解压后双击 `SubtitleGenerator.exe` 即可使用。

            - 无需安装 Python，无需 API Key，视频不会上传
            - 首次运行会联网下载所选识别模型（国内自动走镜像），之后完全离线
            - 分发时请保留整个解压目录，不要只复制单个 exe
